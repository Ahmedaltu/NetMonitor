agent:
  id: "agent-001"
  location: "lab"
  environment: "dev"

interval: 10

ping:
  target: "8.8.8.8"
  targets:
    - "8.8.8.8"
    - "1.1.1.1"
  count: 4

ai:
  url: "http://localhost:11434/api/generate"
  model: "llama3.2:1b"
  timeout: 60

alerts:
  enabled: true
  latency_ms:
    warning: 100
    critical: 200
  packet_loss_pct:
    warning: 5
    critical: 20
  jitter_ms:
    warning: 30
    critical: 50
  hysteresis_cycles: 3

notifications:
  webhook:
    enabled: false
    url: ""  # e.g. https://hooks.slack.com/services/...
    timeout: 10

http_probes: []
  # - url: "https://example.com"
  #   expected_status: 200
  #   timeout: 5

dns_probes: []
  # - hostname: "google.com"
  #   timeout: 3

traceroute:
  enabled: false
  interval_cycles: 6  # run traceroute every N agent cycles

exporters:
  influx:
    enabled: true
    url: "http://localhost:8086"
    org: "net-monitor"
    bucket: "network"

  prometheus:
    enabled: true
    port: 8000
